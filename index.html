<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <title>Getintouch Clone</title>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">Getintouch</div>
        <ul class="menu">
            <li><a href="#features">Features</a></li>
            <li><a href="#pricing">Pricing</a></li>
            <li><button class="download-btn">Download Now</button></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Collaborate smarter</h1>
            <p>Team management at its best</p>
            <div class="buttons">
                <button class="primary-btn">Get started today</button>
                <button class="outline-btn">Our plans</button>
            </div>
        </div>
        <div class="hero-image">
            <img src="images/illustration.png" alt="Collaboration Illustration">
        </div>
    </section>

    <!-- Features Section -->
    <section id="features" class="features">
        <div class="feature-card">
            <img src="images/icons/icon1.svg" alt="Support">
            <h3>Free live support</h3>
            <p>We’re always here whenever you need us...</p>
        </div>
        <!-- Add more feature cards -->
    </section>

    <!-- Footer -->
    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
        <div class="footer-links">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Help</a>
        </div>
        <p>© Getillustrations.com - All rights reserved</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
